{% extends 'base.html' %}
{% load static %}

{% block title %}Add New Product{% endblock %}
{% block header_title %}Add New Product{% endblock %}

{% block header_actions %}
<a href="{% url 'product_list' %}" class="btn btn-secondary">
  <i class="fa-solid fa-arrow-left"></i> Back to Products
</a>
{% endblock %}

{% block content %}
<div style="max-width: 760px; margin: 0 auto;">
  <div class="card">
    <div class="card-header">
      <div class="card-title">
        <i class="fa-solid fa-plus-circle" style="color: var(--primary);"></i>
        <span>Product Information</span>
      </div>
    </div>
    <div class="card-body">
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
          <label class="form-label" for="prod-name">Product Name *</label>
          <input type="text" id="prod-name" name="name" class="form-control" required placeholder="e.g. Coca Cola 500ml">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="prod-sku">SKU Code (Auto-generated if blank)</label>
            <input type="text" id="prod-sku" name="sku" class="form-control" placeholder="e.g. SKU-BEV-001">
          </div>
          <div class="form-group">
            <label class="form-label" for="prod-barcode">Barcode Number</label>
            <input type="text" id="prod-barcode" name="barcode" class="form-control" placeholder="Scan or type barcode">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="prod-category">Category</label>
            <select id="prod-category" name="category" class="form-control">
              <option value="">-- Select Category --</option>
              {% for cat in categories %}
              <option value="{{ cat.id }}">{{ cat.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="prod-image">Product Image</label>
            <input type="file" id="prod-image" name="image" class="form-control" accept="image/*">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="prod-purchase-price">Purchase Price / Cost (Rs.) *</label>
            <input type="number" id="prod-purchase-price" name="purchase_price" step="0.01" min="0" value="0.00" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="prod-selling-price">Selling Price (Rs.) *</label>
            <input type="number" id="prod-selling-price" name="selling_price" step="0.01" min="0" value="0.00" class="form-control" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="prod-stock">Initial Stock Quantity *</label>
            <input type="number" id="prod-stock" name="stock" min="0" value="0" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="prod-min-stock">Minimum Stock Alert Level</label>
            <input type="number" id="prod-min-stock" name="minimum_stock" min="0" value="5" class="form-control">
          </div>
        </div>

        <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px;">
          <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-check"></i> Save Product
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
